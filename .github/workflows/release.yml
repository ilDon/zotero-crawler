name: Release

# Push a tag like v0.2.0 on a commit of master: the plugin is built with that version and
# published as a GitHub release (the .xpi to install in Zotero), together with the
# updates.json that installed copies of the plugin check for automatic updates.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# one run per tag at a time (a tag pushed twice must not publish twice)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not of the form vX.Y.Z"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $TAG does not point to a commit on master"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          node scripts/build.mjs --version "$VERSION"
          XPI="build/zotero-journal-crawler-$VERSION.xpi"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/zotero-journal-crawler-$VERSION.xpi"
          node scripts/updates-json.mjs "$XPI" "$VERSION" "$URL" build/updates.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          FILES=("build/zotero-journal-crawler-$VERSION.xpi" build/updates.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # the release exists already (tag pushed again): replace its files
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
